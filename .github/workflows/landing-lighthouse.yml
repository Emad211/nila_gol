name: Landing Lighthouse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vite.config.js'
      - 'src/App.jsx'
      - 'src/pages/HomePage.jsx'
      - 'src/components/Header/**'
      - 'src/components/Hero/**'
      - 'src/components/HomeDiscovery/**'
      - 'src/components/Products/FeaturedProducts.*'
      - 'src/components/Features/**'
      - 'src/components/About/**'
      - 'src/components/Gallery/**'
      - 'src/components/Reviews/**'
      - 'src/components/Contact/**'
      - 'src/services/catalog.js'
      - 'src/styles/global.css'
      - 'src/styles/landing-research.css'
      - 'src/styles/landing-a11y.css'
      - 'lighthouse/**'
      - 'scripts/lighthouse-summary.mjs'
      - '.github/workflows/landing-lighthouse.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli@0.15.x

      - name: Build storefront
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nila-preview.log 2>&1 &
          echo $! > /tmp/nila-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nila-preview.log
          exit 1

      - name: Mobile Lighthouse
        run: npx lhci autorun --config=./lighthouse/mobile.cjs

      - name: Desktop Lighthouse
        run: npx lhci autorun --config=./lighthouse/desktop.cjs

      - name: Print median Lighthouse scores
        if: always()
        run: node scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-lighthouse-${{ github.sha }}
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 7
