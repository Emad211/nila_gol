name: Supabase E2E report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/supabase-e2e.mjs'
      - 'package.json'
      - '.github/workflows/supabase-e2e-report.yml'

permissions:
  contents: read
  deployments: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for matching Vercel deployment and print report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          deployment_id=""
          environment_url=""

          for i in $(seq 1 40); do
            deployment_id=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/deployments?sha=$SHA&per_page=10" | jq -r '[.[] | select(.creator.login == "vercel[bot]")][0].id // empty')
            if [ -n "$deployment_id" ]; then
              status_json=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$api/deployments/$deployment_id/statuses?per_page=10")
              state=$(echo "$status_json" | jq -r '.[0].state // empty')
              environment_url=$(echo "$status_json" | jq -r '.[0].environment_url // empty')
              echo "Vercel state: ${state:-unknown}"
              if [ "$state" = "success" ] && [ -n "$environment_url" ]; then
                break
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel deployment failed before E2E report could be fetched."
                exit 1
              fi
            fi
            sleep 6
          done

          if [ -z "$environment_url" ]; then
            echo "No successful Vercel environment URL found for $SHA"
            exit 1
          fi

          echo "Deployment: $environment_url"
          echo "===== Supabase E2E report ====="
          curl -fsSL --retry 4 --retry-delay 3 "$environment_url/e2e-report.json" | tee /tmp/e2e-report.json | jq .

          failed=$(jq -r '.summary.failed // 999' /tmp/e2e-report.json)
          cleanup_failed=$(jq -r '.summary.cleanup_failed // 999' /tmp/e2e-report.json)
          if [ "$failed" != "0" ] || [ "$cleanup_failed" != "0" ]; then
            echo "E2E failures: tests=$failed cleanup=$cleanup_failed"
            exit 1
          fi
