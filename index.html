<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#d62e8c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=optional"
    />
    <script>
      // set theme before paint to avoid a flash of the wrong mode. The boutique
      // landing is light-by-default; dark mode is opt-in via the toggle.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta property="og:site_name" content="نیلا گل" />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Per-page title, description, canonical, Open Graph and JSON-LD are injected
         at build time by src/lib/pageSeo.jsx (vite-react-ssg Head), so each
         pre-rendered page has exactly one of each. Client-only routes (cart,
         checkout, account, admin) set their title via src/lib/seo.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://nilagol.ir/#org",
            "name": "نیلا گل",
            "alternateName": "Nila Gol",
            "url": "https://nilagol.ir/",
            "logo": "https://nilagol.ir/pwa-512.png",
            "description": "گل‌های روسی انعطاف‌پذیر و گل مصنوعی لوکس، ماندگار و قابل شستشو."
          },
          {
            "@type": "WebSite",
            "@id": "https://nilagol.ir/#website",
            "url": "https://nilagol.ir/",
            "name": "نیلا گل",
            "inLanguage": "fa-IR",
            "publisher": { "@id": "https://nilagol.ir/#org" }
          },
          {
            "@type": "FloristStore",
            "@id": "https://nilagol.ir/#store",
            "name": "نیلا گل",
            "image": "https://nilagol.ir/pwa-512.png",
            "url": "https://nilagol.ir/",
            "priceRange": "$$",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "گرگان",
              "addressRegion": "گلستان",
              "addressCountry": "IR"
            },
            "areaServed": { "@type": "Country", "name": "Iran" },
            "parentOrganization": { "@id": "https://nilagol.ir/#org" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
