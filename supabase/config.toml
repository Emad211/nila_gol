project_id = "nila_gol"

# Keep the local/CI database away from Supabase CLI defaults. GitHub-hosted
# runners can already have 54322 allocated by another service; these project-
# specific ports make migration replay deterministic without affecting the hosted
# Supabase project.
[db]
port = 55432
shadow_port = 55430

# Guest checkout/payment callbacks must reach this function without a Supabase
# user JWT. The function therefore performs its own authorization: payment
# creation requires a hashed high-entropy order capability; verification requires
# the exact stored ZarinPal authority; reconcile validates an admin JWT itself.
[functions.payment]
verify_jwt = false

# AI assistant proxy (Avalai / OpenAI-compatible). verify_jwt stays ON: the
# anon apikey is a valid JWT, so guests can use it, but a bare unauthenticated
# request is rejected — this keeps the AVALAI budget behind the project's JWT.
[functions.ai-chat]
verify_jwt = true
